<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WoW Forever Enhancement Shaman Simulator</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: #0f1218; color: #e6e9ef;
    font-family: "Segoe UI", Tahoma, sans-serif; display: flex; justify-content: center;
    user-select: none;
  }
  body { align-items: flex-start; flex-wrap: wrap; }
  #app { width: 100%; max-width: 760px; padding: 16px; }
  #buffpanel {
    width: 230px; margin: 16px 0 0 16px; padding: 10px 12px 12px; position: sticky; top: 16px;
    background: #171b24; border: 1px solid #2f394c; border-radius: 6px;
  }
  #buffpanel { max-height: calc(100vh - 32px); overflow-y: auto; }
  #buffpanel h2 { font-size: 15px; color: var(--accent); margin: 0 0 8px; }
  #buffpanel section + section { margin-top: 14px; padding-top: 10px; border-top: 1px solid #2a3242; }
  .buffbtns { display: flex; gap: 6px; margin-bottom: 8px; }
  .buffbtns button {
    flex: 1; font: inherit; font-size: 12px; font-weight: 600; padding: 4px; cursor: pointer;
    background: #232b3a; color: #e6e9ef; border: 1px solid #3d4860; border-radius: 4px;
  }
  .buffbtns button:hover { border-color: var(--accent); }
  .rbuff {
    display: flex; align-items: center; gap: 8px; padding: 5px 4px; cursor: pointer; border-radius: 4px;
    font-size: 12px; opacity: .55;
  }
  .rbuff:hover { background: #1e2430; }
  .rbuff.on { opacity: 1; }
  .rbuff img { width: 26px; height: 26px; border: 1px solid #3d4860; border-radius: 4px; flex: none; }
  .rbuff.on img { border-color: #f5c451; }
  .rbuff small { display: block; color: #76819a; font-size: 10px; line-height: 1.25; }
  .rbuff input { accent-color: #f5c451; flex: none; }
  @media (max-width: 1040px) { #buffpanel { position: static; width: calc(100% - 32px); max-width: 728px; } }
  #startwrap {
    display: none; position: absolute; inset: 40px 0 0; z-index: 3; align-items: center; justify-content: center;
    background: rgba(15, 18, 24, .6);
  }
  #arena.idle #startwrap { display: flex; flex-direction: column; gap: 14px; }
  #hpsetting { font-size: 13px; color: #e6e9ef; display: flex; align-items: center; gap: 8px; }
  #hpinput {
    width: 120px; padding: 5px 8px; font: inherit; font-size: 14px; font-weight: 700; text-align: right;
    background: #171b24; color: #f5c451; border: 1px solid #3d4860; border-radius: 4px;
  }
  #start {
    font: inherit; font-size: 22px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; cursor: pointer;
    padding: 16px 44px; color: #fff; background: linear-gradient(#3fa535, #1f6a1a); border: 2px solid #7fdc6f; border-radius: 8px;
  }
  #start:hover { filter: brightness(1.15); }
  header { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px; }
  h1 { font-size: 20px; margin: 0; color: var(--accent); }
  #meter { font-size: 14px; color: #9aa4b5; font-variant-numeric: tabular-nums; }
  #meter b { color: #f5c451; }

  #arena {
    position: relative; height: 300px; margin-top: 12px; overflow: hidden;
    background: radial-gradient(ellipse at 50% 80%, #232b3a 0%, #131720 70%);
    border: 1px solid #2f394c; border-radius: 6px;
  }
  #target {
    position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%);
    text-align: center; color: #9aa4b5; font-size: 12px;
  }
  #target svg { display: block; margin: 0 auto 4px; }
  #target.hit svg { animation: shake .15s; }
  @keyframes shake { 25% { transform: translateX(-4px) rotate(-2deg); } 75% { transform: translateX(4px) rotate(2deg); } }

  #hpbar {
    position: absolute; left: 12px; right: 12px; top: 10px; height: 20px; background: #1a2a12;
    border: 1px solid #3d5a2a; border-radius: 4px; overflow: hidden;
  }
  #hpfill { height: 100%; width: 100%; background: linear-gradient(#4fb53a, #2e7d20); }
  #hpbar.execute #hpfill { background: linear-gradient(#e0362a, #a3160e); }
  #hpmark { position: absolute; left: 20%; top: 0; bottom: 0; width: 2px; background: #f5c451; opacity: .7; }
  #hptext {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; text-shadow: 1px 1px 2px #000; font-variant-numeric: tabular-nums;
  }
  .floater {
    position: absolute; font-weight: 800; font-size: 20px; pointer-events: none; white-space: nowrap;
    text-shadow: 0 0 3px #000, 1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
    animation: floatUp 1.4s ease-out forwards; transform: translateX(-50%);
  }
  .floater.white { color: #fff; }
  .floater.yellow { color: #ffe100; }
  .floater.crit { font-size: 34px; animation-name: floatCrit; }
  .floater.avoid { color: #ddd; font-size: 16px; font-weight: 600; }
  .floater.bleed { font-size: 14px; }
  .floater.rage { color: #ff5a4a; font-size: 15px; }
  @keyframes floatUp {
    from { opacity: 1; margin-top: 0; } 70% { opacity: 1; } to { opacity: 0; margin-top: -130px; }
  }
  @keyframes floatCrit {
    0% { opacity: 1; margin-top: 0; font-size: 50px; } 15% { font-size: 34px; }
    70% { opacity: 1; } 100% { opacity: 0; margin-top: -130px; }
  }

  #stances { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 12px; color: #9aa4b5; }
  .stance {
    display: flex; align-items: center; gap: 6px; padding: 3px 10px 3px 3px; cursor: pointer; font: inherit; font-size: 12px;
    background: #171b24; color: #76819a; border: 2px solid #2a3242; border-radius: 6px; opacity: .6;
  }
  .stance img { width: 26px; height: 26px; border-radius: 4px; display: block; }
  .stance.active { opacity: 1; color: #f5c451; font-weight: 700; border-color: #f5c451; box-shadow: 0 0 8px rgba(255, 209, 0, .5); }
  .ability.proc { border-color: #ffe100; animation: proc .6s infinite alternate; }
  @keyframes proc { from { box-shadow: 0 0 4px #ffe100; } to { box-shadow: 0 0 14px #ffe100, inset 0 0 10px rgba(255,225,0,.5); } }
  #buffs { height: 62px; overflow: hidden; margin-top: 10px; display: flex; gap: 6px; flex-wrap: wrap; align-content: flex-start; }
  .buff { height: 28px; }
  .buff {
    font-size: 12px; padding: 4px 8px; border-radius: 4px; background: #1e2430;
    border: 1px solid #3d4860; color: #f5c451; font-variant-numeric: tabular-nums;
  }

  .swing { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 11px; color: #9aa4b5; }
  .swing span { width: 62px; }
  .swingbar { flex: 1; height: 6px; background: #1a1f2a; border-radius: 3px; overflow: hidden; }
  .swingbar div { height: 100%; width: 0; background: #c3cad8; }

  #ragebar {
    position: relative; height: 28px; margin-top: 10px; background: #2a0d0a;
    border: 1px solid #5c1f18; border-radius: 4px; overflow: hidden;
  }
  #ragefill { height: 100%; width: 0; background: linear-gradient(#e0362a, #a3160e); }
  #ragetext {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 14px; text-shadow: 1px 1px 2px #000; font-variant-numeric: tabular-nums;
  }

  #bar { display: grid; grid-template-columns: repeat(11, 1fr); gap: 6px; margin-top: 12px; }
  .slot { text-align: center; font-size: 10px; color: #9aa4b5; line-height: 1.2; }
  .ability {
    position: relative; display: block; width: 100%; aspect-ratio: 1; margin-bottom: 3px;
    border: 2px solid #3d4860; border-radius: 6px; overflow: hidden;
    background: #151a23 center / cover no-repeat; color: #e6e9ef; cursor: pointer; padding: 0; font: inherit;
  }
  .ability:hover { border-color: var(--accent); }
  .ability:active { transform: scale(.95); }
  .ability .key, .ability .cost {
    position: absolute; font-size: 11px; font-weight: 700;
    text-shadow: 0 0 2px #000, 1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
  }
  .ability .key { top: 2px; left: 4px; color: #fff; }
  .ability .cost { bottom: 2px; right: 4px; color: #ff8a7b; }

  #tab-combat { position: relative; }
  #summary {
    display: none; position: absolute; inset: 12px 0 0; z-index: 5; padding: 4px 18px 18px; overflow: auto;
    background: rgba(15, 18, 24, .97); border: 1px solid var(--accent); border-radius: 6px;
  }
  #summary.show { display: block; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .wcl-meta { font-size: 12px; color: #9aa4b5; margin: 4px 0 2px; }
  .wcl-meta b { color: #f5c451; }
  table.wcl { font-size: 12px; background: #0b0b0b; border: 1px solid #333; margin-top: 8px; }
  table.wcl th { background: #1a1a1a; color: #e1f2f5; font-size: 11px; padding: 5px 6px; border-bottom: 1px solid #333; white-space: nowrap; }
  table.wcl td { padding: 3px 6px; border-bottom: 1px solid #1c1c1c; color: #ddd; white-space: nowrap; }
  table.wcl tr:nth-child(even) td { background: #121212; }
  table.wcl tr:hover td { background: #1e2a30; }
  .wcl-name { color: #ffe680 !important; font-weight: 600; }
  .wcl-name img { width: 18px; height: 18px; vertical-align: middle; margin-right: 6px; border: 1px solid #444; }
  .wcl-amount { width: 34%; }
  .wcl-amount > span { display: inline-block; vertical-align: middle; }
  .wcl-pct { width: 44px; text-align: right; font-variant-numeric: tabular-nums; }
  .wcl-bar { width: calc(100% - 110px); height: 12px; margin: 0 6px; }
  .wcl-bar i { display: block; height: 100%; background: var(--accent); border-radius: 1px; }
  .wcl-total { width: 50px; text-align: right; font-variant-numeric: tabular-nums; }
  .wcl-totalrow td { background: #1a1a1a !important; font-weight: 700; color: #fff; border-top: 1px solid #333; }
  .reset {
    display: block; width: 100%; margin-top: 14px; padding: 14px; cursor: pointer;
    font: inherit; font-size: 20px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase;
    color: #fff; background: linear-gradient(#c0392b, #7d1810); border: 2px solid #e0685c; border-radius: 8px;
  }
  .reset:hover { filter: brightness(1.15); }
  .reset:active { transform: scale(.99); }
  nav { display: flex; gap: 4px; margin-top: 12px; border-bottom: 1px solid #2f394c; }
  nav button {
    font: inherit; font-size: 13px; font-weight: 600; padding: 6px 16px; cursor: pointer;
    background: #171b24; color: #9aa4b5; border: 1px solid #2f394c; border-bottom: none; border-radius: 6px 6px 0 0;
  }
  nav button.active { background: #232b3a; color: #f5c451; }
  .tab { display: none; }
  .tab.active { display: block; }

  table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 13px; }
  th { text-align: left; color: var(--accent); font-size: 12px; padding: 4px 8px; border-bottom: 1px solid #2f394c; }
  td { padding: 5px 8px; border-bottom: 1px solid #1e2430; vertical-align: middle; }
  td.dim, .dim { color: #76819a; }
  .q-epic { color: #a335ee; font-weight: 600; } .q-rare { color: #0070dd; font-weight: 600; }
  .custom-toggle { display: flex; align-items: center; gap: 8px; margin-top: 14px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .custom-toggle input { accent-color: #f5c451; width: 16px; height: 16px; }
  .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin-top: 10px; }
  .fields label { font-size: 12px; color: #9aa4b5; display: flex; flex-direction: column; gap: 3px; }
  .fields input {
    padding: 6px 8px; font: inherit; font-size: 15px; font-weight: 700; background: #171b24; color: #f5c451;
    border: 1px solid #3d4860; border-radius: 4px; width: 100%;
  }
  .fields.off { opacity: .45; }
  .plain-btn {
    font: inherit; font-size: 12px; font-weight: 600; padding: 5px 12px; margin-top: 10px; cursor: pointer;
    background: #232b3a; color: #e6e9ef; border: 1px solid #3d4860; border-radius: 4px;
  }
  .plain-btn:hover { border-color: var(--accent); }
  .tab h2 { font-size: 15px; color: var(--accent); margin: 18px 0 0; }
  .statgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 6px; margin-top: 10px; }
  .stat { background: #171b24; border: 1px solid #2a3242; border-radius: 4px; padding: 6px 10px; font-size: 12px; color: #9aa4b5; }
  .stat b { display: block; font-size: 17px; color: #f5c451; }
  .talent-icon, .buff img { width: 28px; height: 28px; border: 1px solid #3d4860; border-radius: 4px; display: block; }
  .buff { display: flex; align-items: center; gap: 6px; }
  .buff img { width: 18px; height: 18px; }
  .ench { color: #1eff00; font-size: 11px; }
  .rank { color: #f5c451; font-weight: 700; white-space: nowrap; }
  .tag { font-size: 10px; padding: 1px 6px; border-radius: 8px; white-space: nowrap; }
  .trees { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; }
  .tree { background: #171b24; border: 1px solid #2a3242; border-radius: 6px; padding: 0 14px 14px; margin-top: 12px; }
  .tree h2 { margin: 10px 0; text-align: center; }
  .tgrid { display: grid; grid-template-columns: repeat(4, 40px); grid-template-rows: repeat(7, 40px); gap: 14px 10px; }
  .tnode {
    position: relative; z-index: 1; width: 40px; height: 40px; border: 2px solid #f5c451; border-radius: 5px;
    background: #151a23 center / cover no-repeat;
  }
  .tnode span {
    position: absolute; right: -6px; bottom: -6px; font-size: 10px; font-weight: 700; padding: 0 3px;
    background: #000; border-radius: 3px; color: #f5c451;
  }
  .tnode.partial { border-color: #40bf40; } .tnode.partial span { color: #40bf40; }
  .tnode.empty { border-color: #343c4c; filter: grayscale(1) brightness(.8); } .tnode.empty span { color: #999; }
  .tnode i {
    position: absolute; left: -6px; top: -6px; font-size: 9px; font-style: normal; font-weight: 700; padding: 0 3px;
    background: #1f3a1c; color: #7fdc6f; border-radius: 3px;
  }
  .tlink { width: 4px; justify-self: center; background: #343c4c; margin: 20px 0; }
  .tlink.on { background: #f5c451; }
  #talent-tip {
    display: none; position: fixed; z-index: 50; max-width: 300px; padding: 9px 11px; pointer-events: none;
    background: #0b0e13; border: 1px solid var(--accent); border-radius: 6px; box-shadow: 0 4px 14px rgba(0, 0, 0, .7);
    font-size: 12px; line-height: 1.4; color: #e6e9ef;
  }
  #talent-tip .tip-head { display: flex; justify-content: space-between; gap: 14px; align-items: baseline; }
  #talent-tip .tip-head b { font-size: 14px; color: #fff; }
  #talent-tip .tip-head span { color: #9aa4b5; white-space: nowrap; }
  #talent-tip .tip-new { color: #7fdc6f; font-size: 11px; }
  #talent-tip .tip-desc { color: #f5c451; margin-top: 5px; }
  #talent-tip .tip-status { margin-top: 6px; font-size: 11px; color: #76819a; }
  #talent-tip .tip-status.sim { color: #7fdc6f; }
  .tnode { cursor: help; }
  .tag.sim { background: #1f3a1c; color: #7fdc6f; } .tag.off { background: #1e2430; color: #76819a; }
  .ability .cdmask { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: rgba(0,0,0,.72); pointer-events: none; }
  .ability .cdtext {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 800; color: #fff; text-shadow: 1px 1px 2px #000; pointer-events: none;
  }
  #keybar { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 12px; color: #9aa4b5; }
  #keybar button {
    font: inherit; font-size: 12px; font-weight: 600; padding: 4px 10px; cursor: pointer;
    background: #232b3a; color: #e6e9ef; border: 1px solid #3d4860; border-radius: 4px;
  }
  #keybar button:hover { border-color: var(--accent); }
  #keybar button.active { background: #f5c451; color: #0f1218; border-color: #f5c451; }
  #rebind-hint.warn { color: #ff7a6b; font-weight: 700; }
  #rebind-reset { display: none; }
  #keybar.editing #rebind-reset { display: inline-block; }
  #bar.editing .ability { filter: none; border-style: dashed; border-color: var(--accent); }
  #bar.editing .ability.rebind-target { border-style: solid; border-color: #40bf40; box-shadow: 0 0 10px #40bf40; }
  .ability.norage { filter: grayscale(.8) brightness(.6); }
  .ability.queued { border-color: #ffe100; box-shadow: 0 0 10px #ffe100, inset 0 0 10px rgba(255,225,0,.4); }
  .ability.denied { animation: denied .2s; }
  @keyframes denied { 50% { border-color: #ff3020; } }

  #log {
    margin-top: 12px; height: 132px; overflow: hidden; font-size: 12px; line-height: 1.35;
    background: #171b24; border: 1px solid #2a3242; border-radius: 4px; padding: 6px 8px;
    display: flex; flex-direction: column; justify-content: flex-end; color: #9aa4b5;
  }
  #log .y { color: #ffe100; } #log .w { color: #fff; } #log .r { color: #ff7a6b; }
  footer { margin-top: 10px; font-size: 11px; color: #667089; line-height: 1.4; }

  /* Theme: modern slate */
  :root { --accent: var(--accent); }
  body {
    font-family: Inter, "Segoe UI", system-ui, -apple-system, sans-serif;
    background: #0f1218 radial-gradient(1100px 520px at 50% -180px, #1b2233, transparent) no-repeat;
  }
  h1 { color: var(--accent); font-weight: 700; letter-spacing: .2px; }
  #meter { color: #9aa4b5; }
  nav { border-bottom: none; gap: 6px; }
  nav button { border: 1px solid #2a3242; border-radius: 999px; padding: 6px 18px; background: #171b24; transition: background .12s, color .12s; }
  nav button:hover { color: #e6e9ef; border-color: #3d4860; }
  nav button.active { background: var(--accent); color: #0f1218; border-color: var(--accent); }
  #arena { border-radius: 12px; border-color: #2a3242; background: radial-gradient(ellipse at 50% 85%, #232b3a 0%, #131720 72%); box-shadow: inset 0 0 70px rgba(0, 0, 0, .35); }
  #log, .tree, #buffpanel, .stat, #summary { border-radius: 10px; }
  #buffpanel { box-shadow: 0 6px 24px rgba(0, 0, 0, .25); }
  #buffpanel h2, .tab h2 { font-size: 12px; letter-spacing: .6px; text-transform: uppercase; }
  .ability { border-radius: 10px; }
  .ability:hover { border-color: var(--accent); }
  #ragebar, #hpbar, #manabar { border-radius: 8px; }
  .swingbar { border-radius: 999px; }
  .buff { border-radius: 999px; padding: 4px 10px; }
  .reset, #start { border-radius: 10px; }
  .stance { border-radius: 999px; }
  .stat b { color: #f5c451; }
  table:not(.wcl) td { border-bottom-color: #1e2430; }
  table:not(.wcl) th { color: #9aa4b5; text-transform: uppercase; letter-spacing: .5px; font-size: 11px; }
  footer { color: #667089; }

  /* Mana bar, cast bar */
  #ragebar.mana { background: #0a1630; border-color: #1f3f7a; }
  #ragebar.mana #ragefill { background: linear-gradient(#3b82f6, #1d4ed8); }
  .floater.mana { color: #6fb0ff; font-size: 15px; }
  .castbar { position: relative; height: 16px; border: 1px solid #2a3242; }
  #castbar { background: linear-gradient(#f5c451, #c79100); }
  #casttext {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-style: normal; font-size: 11px; font-weight: 700; color: #fff; text-shadow: 1px 1px 2px #000;
  }
  #specbar { display: flex; gap: 6px; margin-top: 10px; }
  #specbar button {
    flex: 1; font: inherit; font-size: 14px; font-weight: 700; padding: 8px; cursor: pointer;
    background: #171b24; color: #9aa4b5; border: 2px solid #2f394c; border-radius: 6px;
  }
  #specbar button:hover { border-color: #f58cba; }
  #specbar button.active { background: #3a1f2c; color: #f58cba; border-color: #f58cba; }
  :root { --accent: #f58cba; }

  /* Shaman colours */
  :root { --accent: #3d9bff; }
</style>
</head>
<body>
<aside id="buffpanel"></aside>
<div id="app">
  <header>
    <h1>WoW Forever &mdash; <span id="spec-title"></span> (60)</h1>
    <div id="meter"></div>
  </header>

  <nav>
    <button data-tab="combat" class="active">Combat</button>
    <button data-tab="gear">Gear</button>
    <button data-tab="talents">Talents</button>
    <button data-tab="stats">Stats</button>
  </nav>

  <div id="tab-combat" class="tab active">
  <div id="summary">
    <h2>Damage Done</h2>
    <div id="summary-body"></div>
    <button class="reset">Reset</button>
  </div>
  <div id="arena">
    <div id="hpbar"><div id="hpfill"></div><div id="hpmark"></div><div id="hptext"></div></div>
    <div id="startwrap">
      <button id="start">Start fight</button>
      <label id="hpsetting">Dummy health <input id="hpinput" type="number" min="1000" max="100000000" step="5000"></label>
    </div>
    <div id="target">

// Unbuffed character-sheet stats from the gear list, with talents and the Rockbiter imbue included
function gearSheet() {
  const str = BASE.str + gearSum('str');
  const agi = BASE.agi + gearSum('agi');
  const int = Math.round((BASE.int + gearSum('int')) * (1 + 0.02 * T('Ancestral Knowledge')));
  const spi = BASE.spi + gearSum('spi');
  // Forever gear gives one hit and one crit value that count for melee and spells alike
  const gearCrit = gearSum('critRating') / CRIT_RATING_PER_PCT;
  const axeSpec = BASE.race === 'Orc' && weaponItem().weapon.type === 'Axe' ? 1 : 0;
  const w = weaponItem().weapon;
  return {
    str, agi, int, spi,
    ap: Math.round(BASE.ap + 2 * str + gearSum('ap') + rockbiterAp() + dexterity() * int),
    crit: +(BASE.meleeCrit + agi * CRIT_PER_AGI + gearCrit + T('Thundering Strikes') + axeSpec).toFixed(2),
    spellCrit: +(BASE.spellCrit + int * SPELL_CRIT_PER_INT + gearCrit + T('Thundering Strikes') + axeSpec).toFixed(2),
    hit: gearSum('hitRating') / HIT_RATING_PER_PCT,
    sp: Math.round(gearSum('sp') + quickness() * int),
    wMin: w.min, wMax: w.max, wSpeed: w.speed,
  };
}

    (on('shout') ? BATTLE_SHOUT_AP : 0) + (on('might') ? 133 : 0) + (on('jujumight') ? 40 : 0));
  CFG.crit = sheet.crit + (STATS.agi - sheet.agi) * CRIT_PER_AGI + (on('lotp') ? 3 : 0) + (on('mongoose') ? 2 : 0);
  CFG.spellCrit = sheet.spellCrit + (STATS.int - sheet.int) * SPELL_CRIT_PER_INT + (on('lotp') ? 3 : 0);
  CFG.hit = sheet.hit;
  CFG.sp = Math.round(sheet.sp + quickness() * (STATS.int - sheet.int) + (on('flask') ? 150 : 0) + (on('arcane') ? 35 : 0));
  CFG.firepower = on('firepower') ? 10 : 0;
  // 1 mana per point for the first 20 Intellect, 15 after that
  CFG.maxMana = Math.round(BASE.mana + 20 + 15 * Math.max(0, STATS.int - 20));
  CFG.spiritRegen = STATS.spi / 5 + 17;     // per 2 sec tick when not casting
  CFG.weapon = { min: sheet.wMin, max: sheet.wMax, speed: sheet.wSpeed };
  CFG.crusaderAp = Math.round(200 * kings);
  CFG.windfury = on('wf');
  CFG.chili = on('chili');
  CFG.wisdom = on('wisdom');
  CFG.manaSpring = on('spring');
  CFG.jow = on('jow');
  CFG.arthas = on('arthas') ? 8 : 0;
  // Boss armor after debuffs; damage reduction = armor / (armor + 400 + 85 * attacker level)
  CFG.targetArmor = Math.max(0, CFG.bossArmor - (on('sunder') ? 2250 : 0) - (on('ff') ? 505 : 0) - (on('cor') ? 505 : 0));
  CFG.armorMult = 1 - CFG.targetArmor / (CFG.targetArmor + 400 + 85 * 60);

// State

  swing: 0, cast: null,                        // cast: { ability, until }

const addMana = n => { const g = Math.min(n, CFG.maxMana - S.mana); S.mana += g; S.manaGained += g; };
const furyMult = () => S.t < S.buffs.bloodFury ? CFG.bloodFuryMult : 1;

// ---------------------------------------------------------------------------
// Attack tables
// ---------------------------------------------------------------------------
function rollWhite() {
  let r = Math.random() * 100;
  if ((r -= Math.max(0, CFG.baseMiss - CFG.hit)) < 0) return 'miss';
  if ((r -= CFG.dodge) < 0) return 'dodge';
  if ((r -= CFG.glanceChance) < 0) return 'glance';
  if ((r -= meleeCrit()) < 0) return 'crit';
  return 'hit';
}
function rollYellow() {
  const miss = Math.max(0, CFG.baseMiss - CFG.hit);
  const r = Math.random() * 100;
  if (r < miss) return 'miss';
  if (r < miss + CFG.dodge) return 'dodge';
  return Math.random() * 100 < meleeCrit() ? 'crit' : 'hit';
}
function rollSpell() {
  if (Math.random() * 100 < Math.max(CFG.minSpellMiss, CFG.baseSpellMiss - CFG.hit)) return 'miss';
  return Math.random() * 100 < CFG.spellCrit ? 'crit' : 'hit';
}

// ---------------------------------------------------------------------------
// Damage plumbing
// ---------------------------------------------------------------------------
function damageTarget(name, dmg, crit) {
  dmg = Math.min(dmg, Math.ceil(S.hp));
  S.totalDamage += dmg;
  S.hp -= dmg;
  const st = statFor(name);
  st.dmg += dmg; st.hits++; if (crit) st.crits++;
  if (S.hp <= 0) endFight();
  return dmg;
}

function deal(name, dmg, crit, cls) {
  if (S.over) return 0;
  dmg = damageTarget(name, Math.round(dmg), crit);
  floater(dmg + (crit ? '!' : ''), cls + (crit ? ' crit' : ''));
  log(`<span class="${cls.startsWith('yellow') ? 'y' : 'w'}">${name} ${crit ? 'crits' : 'hits'} for ${dmg}.</span>`);
  targetEl.classList.remove('hit'); void targetEl.offsetWidth; targetEl.classList.add('hit');
  return dmg;
}

function avoided(name, res) {
  if (S.over) return;
  statFor(name).avoided++;
  const word = res === 'dodge' ? 'Dodge' : 'Miss';
  floater(word, 'avoid');
  log(`${name}: ${word.toLowerCase()}.`);
}

// Effects that follow a landed melee hit. kind: 'white' | 'extra' | 'ss'
function onMeleeHit(kind, crit) {
  if (S.over) return;
  if (crit && T('Flurry')) S.flurry = 3;
  if (CFG.jow && Math.random() < CFG.jowChance) addMana(CFG.jowMana);
  // Maelstrom Weapon: 2 procs per minute per point on melee hits
  if (T('Maelstrom Weapon') && Math.random() < CFG.maelstromPpmPerPoint * T('Maelstrom Weapon') * CFG.weapon.speed / 60) {
    S.maelstrom = S.t < S.buffs.maelstrom ? Math.min(5, S.maelstrom + 1) : 1;
    S.buffs.maelstrom = S.t + CFG.maelstromDuration;
  }
  if (Math.random() < CFG.crusaderPpm * CFG.weapon.speed / 60) {
    if (S.t >= S.buffs.crusader) log('<span class="r">You gain Holy Strength.</span>');
    S.buffs.crusader = S.t + 15;
  }
  if (CFG.chili && S.t >= S.chiliReady && Math.random() < CFG.chiliChance) {
    S.chiliReady = S.t + CFG.chiliCd;
    const dmg = damageTarget('Dragonbreath Chili', CFG.chiliDamage, false);
    floater(dmg, 'yellow bleed');
    log(`<span class="y">Dragonbreath Chili hits for ${dmg}.</span>`);
  }
  // Windfury Totem: swings and Stormstrike; not its own extra attacks
  if (CFG.windfury && kind !== 'extra' && Math.random() < CFG.windfuryChance) {
    log('<span class="r">Windfury grants an extra attack.</span>');
    whiteAttack(true);
  }
}

// Effects that follow a damaging spell cast (Fire Nova, shocks, Lightning Bolt)
function onSpellCast(landed, crit) {
  if (landed && CFG.jow && Math.random() < CFG.jowChance) addMana(CFG.jowMana);
  if (landed && crit && T('Elemental Devastation')) S.buffs.devastation = S.t + 10;
  if (T('Elemental Focus') && Math.random() < CFG.clearcastChance) {
    S.clearcast = true;
    log('<span class="r">You gain Clearcasting.</span>');
  }
}

// ---------------------------------------------------------------------------
// Swings
// ---------------------------------------------------------------------------
function whiteAttack(extra) {
  if (S.over) return;
  const name = extra ? 'Windfury Attack' : 'Melee';
  const res = rollWhite();
  // Flurry: a crit refills the charges; any white swing then uses one (at most one per 0.5 sec)
  if (res === 'crit' && T('Flurry')) S.flurry = 3;
  if (S.flurry > 0 && S.t >= S.flurryIcd) { S.flurry--; S.flurryIcd = S.t + 0.5; }
  if (res === 'miss' || res === 'dodge') return avoided(name, res);
  let dmg = (weaponRoll() + (extra ? CFG.windfuryAp / 14 * CFG.weapon.speed : 0)) * CFG.armorMult;
  if (res === 'glance') dmg *= CFG.glanceMult;
  if (res === 'crit') dmg *= 2;
  deal(name, dmg + CFG.arthas, res === 'crit', 'white');
  onMeleeHit(extra ? 'extra' : 'white', res === 'crit');

function press(a) {

  const cost = a.cost();
  if (S.cast || S.t < (S.ready[a.id] || 0) || (a.gcd && S.t < S.gcdUntil) || S.mana < cost || (a.usable && !a.usable())) return deny(a);
  const castTime = a.castTime ? a.castTime() : 0;
  S.mana -= cost; S.manaSpent += cost;
  // Earth Shock and Flame Shock share one cooldown
  for (const b of a.shock ? ABILITIES.filter(x => x.shock) : [a]) S.ready[b.id] = S.t + cdOf(b);
  if (a.gcd) S.gcdUntil = S.t + (a.gcdTime || CFG.gcd);
  if (a.onStart) a.onStart();

// ---------------------------------------------------------------------------
// Simulation tick
// ---------------------------------------------------------------------------
function tick(dt) {
  S.t += dt;

  // Mana every 2 sec: Blessing of Wisdom, Mana Spring Totem, and a share of Spirit regeneration after Stormstrike
  S.manaTimer += dt;
  while (S.manaTimer >= CFG.manaTick) {
    S.manaTimer -= CFG.manaTick;
    addMana((CFG.wisdom ? CFG.wisdomTick : 0) + (CFG.manaSpring ? CFG.manaSpringTick : 0) +
      (S.t < S.buffs.impSs ? CFG.impStormstrikeRegen * CFG.spiritRegen : 0));
  }

  // Searing Totem attacks: spell hit and crit, no spell damage scaling
  while (S.t < S.searing.until && S.t >= S.searing.next && !S.over) {
    S.searing.next += CFG.searingEvery;
    const res = rollSpell();
    if (res === 'miss') { statFor('Searing Totem').avoided++; continue; }
    const crit = res === 'crit';
    const dmg = damageTarget('Searing Totem', Math.round(rand(CFG.searingMin, CFG.searingMax) * fireMult() * CFG.resistMult * (crit ? 1.5 : 1)), crit);
    floater(dmg + (crit ? '!' : ''), 'yellow bleed');
    log(`<span class="y">Searing Totem ${crit ? 'crits' : 'hits'} for ${dmg}.</span>`);
  }

  // Flame Shock burn
  while (S.flame.ticks > 0 && S.t >= S.flame.next && !S.over) {
    S.flame.ticks--; S.flame.next += CFG.fsTickEvery;
    const crit = Math.random() * 100 < CFG.spellCrit;
    const dmg = damageTarget('Flame Shock (burn)', Math.round(S.flame.dmg * (crit ? 1.5 : 1)), crit);
    floater(dmg + (crit ? '!' : ''), 'yellow bleed');
    log(`<span class="y">Flame Shock burns for ${dmg}.</span>`);
  }

  if (S.cast) {
    if (S.t >= S.cast.until) { const a = S.cast.ability; S.cast = null; S.swing = 0; a.use(); }
  } else {
    S.swing += dt * haste() / CFG.weapon.speed;
    if (S.swing >= 1) { S.swing -= 1; whiteAttack(false); }
  }
}

// Class-specific pieces used by the shared interface code
function classBuffs() {
  const buffs = [];
  const stacks = maelstromStacks();
  if (stacks) buffs.push(['spell_shaman_maelstromweapon', `Maelstrom Weapon (${stacks}) ${fmtTime(S.buffs.maelstrom - S.t)}`]);
  if (S.clearcast) buffs.push(['spell_shadow_manaburn', 'Clearcasting']);
  if (S.t < S.ssDebuffUntil) buffs.push(['ability_shaman_stormstrike', `Stormstrike ${fmtTime(S.ssDebuffUntil - S.t)}`]);
  if (fireTotemUp()) buffs.push(['spell_fire_searingtotem', `Searing Totem ${fmtTime(S.searing.until - S.t)}`]);
  if (S.flame.ticks > 0) buffs.push(['spell_fire_flameshock', `Flame Shock (${S.flame.ticks})`]);
  if (S.flurry > 0) buffs.push(['ability_ghoulfrenzy', `Flurry (${S.flurry})`]);
  if (S.t < S.buffs.devastation) buffs.push(['spell_fire_elementaldevastation', `Elemental Devastation ${fmtTime(S.buffs.devastation - S.t)}`]);
  if (S.t < S.buffs.farseer) buffs.push(['spell_nature_bloodlust', `Rage of the Farseer ${fmtTime(S.buffs.farseer - S.t)}`]);
  if (S.t < S.buffs.bloodFury) buffs.push(['racial_orc_berserkerstrength', `Blood Fury ${fmtTime(S.buffs.bloodFury - S.t)}`]);
  if (S.t < S.buffs.crusader) buffs.push(['spell_holy_blessingofstrength', `Holy Strength ${fmtTime(S.buffs.crusader - S.t)}`]);
  return buffs;
}

}
function setRebinding(on) {
  rebinding = on;
  $('bar').classList.toggle('editing', on);
  $('keybar').classList.toggle('editing', on);
  $('rebind').classList.toggle('active', on);
  $('rebind').textContent = on ? 'Done' : 'Change keybinds';
  selectRebind(null);
  if (!on) $('rebind-hint').textContent = '';
}

function buildBar() {
  const bar = $('bar');
  bar.innerHTML = '';
  const list = barAbilities();
  bar.style.gridTemplateColumns = `repeat(${list.length}, 1fr)`;
  const saved = store.get(keyStore(), {});
  list.forEach((a, i) => {
    a.defaultKey = DEFAULT_KEYS[i] || '';
    a.key = typeof saved[a.id] === 'string' ? saved[a.id] : a.defaultKey;
    const el = document.createElement('button');
    el.className = 'ability';
    const cd = cdOf(a);
    el.title = `${a.name}\n${Math.round(a.cost()) ? Math.round(a.cost()) + ' mana' : 'No cost'}${cd ? ' · ' + (cd >= 60 ? cd / 60 + ' min' : cd + ' sec') + ' cooldown' : ''}\n${a.desc}`;
    el.style.backgroundImage = `url(${iconUrl(a.icon)})`;
    el.innerHTML = `<span class="key"></span>` + (Math.round(a.cost()) ? `<span class="cost">${Math.round(a.cost())}</span>` : '') +
      `<div class="cdmask"></div><div class="cdtext"></div>`;
    el.addEventListener('click', () => { if (rebinding) selectRebind(a); else press(a); });
    a.el = el; a.mask = el.querySelector('.cdmask'); a.cdText = el.querySelector('.cdtext'); a.keyEl = el.querySelector('.key');
    const slot = document.createElement('div');
    slot.className = 'slot';
    slot.append(el, a.name);
    bar.appendChild(slot);
  });
  showKeys();
}

$('rebind').addEventListener('click', () => setRebinding(!rebinding));
$('rebind-reset').addEventListener('click', () => {
  for (const a of barAbilities()) a.key = a.defaultKey;
  saveKeys(); showKeys(); selectRebind(null);
});
document.addEventListener('keydown', e => {
  if (e.repeat || e.altKey || e.metaKey || e.target.tagName === 'INPUT') return;
  if (['Shift', 'Control', 'Alt', 'Meta', 'Tab', 'CapsLock'].includes(e.key)) return;
  const key = normKey(e);
  if (rebinding) {
    e.preventDefault();
    if (e.key === 'Escape') return rebindTarget ? selectRebind(null) : setRebinding(false);
    if (!rebindTarget) return;
    if (RESERVED_KEYS.includes(key)) {
      $('rebind-hint').classList.add('warn');
      $('rebind-hint').textContent = `${key.replace(/[a-z]$/, c => c.toUpperCase())} is a browser shortcut and cannot be bound. Pick another key for ${rebindTarget.name}.`;
      return;
    }
    for (const a of barAbilities()) if (a.key === key) a.key = '';
    rebindTarget.key = key;
    saveKeys(); showKeys(); selectRebind(null);
    return;
  }
  const a = barAbilities().find(a => a.key && a.key === key);
  if (a) { e.preventDefault(); press(a); }
});

// --- Fight overview (Warcraft Logs style) and reset ---
function endFight() {
  S.over = true;
  S.hp = 0;
  const n = v => Math.round(v).toLocaleString();
  const pct = (x, of) => of ? (x / of * 100).toFixed(1) + '%' : '-';
  const sources = Object.entries(S.stats).sort((x, y) => y[1].dmg - x[1].dmg);
  const top = sources.length ? sources[0][1].dmg : 1;
  let casts = 0, hits = 0, crits = 0, avoid = 0;
  const rows = sources.map(([name, st]) => {
    const info = sourceInfo(name);
    const stCasts = st.hits + st.avoided;
    casts += stCasts; avoid += st.avoided; hits += st.hits; crits += st.crits;
    return `<tr><td class="wcl-name"><img src="${iconUrl(info.icon)}" alt="">${info.label}</td>` +
      `<td class="wcl-amount"><span class="wcl-pct">${pct(st.dmg, S.totalDamage)}</span>` +
      `<span class="wcl-bar"><i style="width:${st.dmg / top * 100}%"></i></span><span class="wcl-total">${n(st.dmg)}</span></td>` +
      `<td class="num">${stCasts}</td><td class="num">${stCasts ? n(st.dmg / stCasts) : '-'}</td>` +
      `<td class="num">${st.hits}</td><td class="num">${st.hits ? n(st.dmg / st.hits) : '-'}</td>` +
      `<td class="num">${pct(st.crits, st.hits)}</td><td class="num">${pct(st.avoided, stCasts)}</td>` +
      `<td class="num">${(st.dmg / S.t).toFixed(1)}</td></tr>`;
  }).join('');
  $('summary-body').innerHTML =
    `<div class="wcl-meta">Fight length <b>${fmtTime(S.t)}</b> · Mana spent <b>${n(S.manaSpent)}</b> · Mana gained <b>${n(S.manaGained)}</b> · ` +
    `Mana left <b>${n(S.mana)}</b></div>` +
    `<table class="wcl"><tr><th>Name</th><th>Amount</th><th class="num">Casts</th><th class="num">Avg Cast</th>` +
    `<th class="num">Hits</th><th class="num">Avg Hit</th><th class="num">Crit %</th><th class="num">Miss %</th><th class="num">DPS</th></tr>` +
    rows +
    `<tr class="wcl-totalrow"><td>Total</td><td class="wcl-amount"><span class="wcl-pct">100%</span><span class="wcl-bar"></span>` +
    `<span class="wcl-total">${n(S.totalDamage)}</span></td><td class="num">${casts}</td><td class="num">-</td>` +
    `<td class="num">${hits}</td><td class="num">-</td><td class="num">${pct(crits, hits)}</td><td class="num">${pct(avoid, casts)}</td>` +
    `<td class="num">${(S.totalDamage / S.t).toFixed(1)}</td></tr></table>`;
  $('summary').classList.add('show');
}

function reset() {
  Object.assign(S, newState());
  $('hpinput').value = CFG.targetHp;
  logEl.innerHTML = '';
  arenaEl.querySelectorAll('.floater').forEach(el => el.remove());
  $('summary').classList.remove('show');
  last = performance.now();
}
$('hpinput').value = CFG.targetHp;
$('hpinput').addEventListener('input', e => {
  const v = Math.round(Number(e.target.value));
  if (!Number.isFinite(v) || v < 1000 || S.started) return;
  CFG.targetHp = Math.min(v, 100000000);
  S.hp = CFG.targetHp;
});
$('hpinput').addEventListener('change', e => { e.target.value = CFG.targetHp; });
$('start').addEventListener('click', () => { S.started = true; last = performance.now(); });
document.querySelectorAll('.reset').forEach(btn => btn.addEventListener('click', reset));

// --- Tabs ---
for (const btn of document.querySelectorAll('nav button')) {
  btn.addEventListener('click', () => {
    document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b === btn));
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.id === 'tab-' + btn.dataset.tab));
  });
}

// --- Gear tab ---
function renderGearTab() {
  const pctOf = (rating, per) => `+${(rating / per).toFixed(1)}%`;
  const statText = g => [
    g.weapon && `${g.weapon.min}-${g.weapon.max} damage, ${g.weapon.speed.toFixed(2)} speed`,
    g.str && `+${g.str} Str`, g.agi && `+${g.agi} Agi`, g.int && `+${g.int} Int`, g.ap && `+${g.ap} AP`, g.sp && `+${g.sp} spell damage`,
    g.critRating && `${pctOf(g.critRating, CRIT_RATING_PER_PCT)} crit`, g.hitRating && `${pctOf(g.hitRating, HIT_RATING_PER_PCT)} hit`,
    g.note,
  ].filter(Boolean).join(', ');
  const stat = (label, value) => `<div class="stat"><b>${value}</b>${label}</div>`;
  const row = g => g.name
    ? `<tr><td class="dim">${g.slot}</td><td style="width:36px"><img class="talent-icon" src="${iconUrl(g.icon)}" alt=""></td>` +
      `<td><span class="q-${g.q}">${g.name}</span>${g.enchant ? `<div class="ench">${g.enchant}</div>` : ''}</td><td>${statText(g)}</td></tr>`
    : `<tr><td class="dim">${g.slot}</td><td></td><td class="dim">Empty</td><td></td></tr>`;
  $('tab-gear').innerHTML =
    (custom().on ? `<h2>Custom stats are active (Stats tab): the gear below is not used for stats.</h2>` : '') +
    `<div class="statgrid">` +
      stat('Attack power (buffed)', CFG.ap) + stat('Spell damage (buffed)', CFG.sp) +
      stat('Melee crit chance', CFG.crit.toFixed(2) + '%') + stat('Spell crit chance', CFG.spellCrit.toFixed(2) + '%') +
      stat('Hit chance (melee and spells)', '+' + CFG.hit + '%') + stat('Maximum mana', CFG.maxMana) +
      stat('Strength', STATS.str) + stat('Agility', STATS.agi) + stat('Intellect', STATS.int) +
    `</div>` +
    `<table><tr><th>Slot</th><th></th><th>Item</th><th>Stats used by the sim</th></tr>${SPEC.gear.map(row).join('')}</table>` +
    `<footer>Gear and enchants from the MythicSim WoW Forever ${SPEC.title} tier-list preset (pre-raid, both trinket slots empty). ` +
    `${BASE.race} shaman. Hit and crit on Forever gear count for melee and spells alike. Attack power = ${BASE.ap} base + 2 per Strength + gear + buffs. ` +
    `Attack power includes Rockbiter Weapon (${Math.round(rockbiterAp())}) and Intellect from Mental Dexterity; spell damage includes ${Math.round(quickness() * 100)}% of Intellect from Mental Quickness. ` +
    `Boss armor after debuffs: ${CFG.targetArmor} (${((1 - CFG.armorMult) * 100).toFixed(1)}% physical damage reduction). ` +
    `Crusader: about 1 proc per minute, +100 Strength for 15 sec. Weapon damage and enchant values are Classic figures.</footer>`;
}

// --- Talents tab ---
function renderTalentsTab() {
  const treePoints = tree => tree.talents.reduce((n, t) => n + T(t[0]), 0);
  const treeHtml = tree => {
    let cells = '';
    for (const [name, max, row, col, icon, desc, isNew, req] of tree.talents) {
      const pts = T(name);
      const state = pts === 0 ? 'empty' : pts === max ? 'full' : 'partial';
      if (req) {
        const from = tree.talents.find(t => t[0] === req);
        cells += `<div class="tlink ${pts ? 'on' : ''}" style="grid-column:${col};grid-row:${from[2]} / ${row + 1}"></div>`;
      }
      const esc = s => String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;');
      cells += `<div class="tnode ${state}" style="grid-column:${col};grid-row:${row};background-image:url(${iconUrl(icon)})" ` +
        `data-name="${esc(name)}" data-pts="${pts}" data-max="${max}" data-desc="${esc(desc)}" data-sim="${SIM_TALENTS.has(name) ? 1 : ''}" data-isnew="${isNew ? 1 : ''}">` +
        (isNew ? '<i>new</i>' : '') + `<span>${pts}/${max}</span></div>`;
    }
    return `<div class="tree"><h2>${tree.name} <span class="dim">(${treePoints(tree)})</span></h2><div class="tgrid">${cells}</div></div>`;
  };
  $('tab-talents').innerHTML =
    `<div class="trees">${TREES.map(treeHtml).join('')}</div>` +
    `<footer>${TREES.map(treePoints).join(' / ')} (51 points). ${SPEC.name} build from the MythicSim preset; talents are fixed. ` +
    `Hover a talent to see what it does and whether this simulation models it.</footer>`;
}

// --- Talent tooltips: hover a talent in the tree ---
{
  const tip = document.createElement('div');
  tip.id = 'talent-tip';
  document.body.appendChild(tip);
  let current = null;
  document.addEventListener('mousemove', e => {
    const node = e.target.closest ? e.target.closest('.tnode') : null;
    if (!node) { tip.style.display = 'none'; current = null; return; }
    if (node !== current) {
      current = node;
      const d = node.dataset;
      const taken = Number(d.pts) > 0;
      tip.innerHTML = `<div class="tip-head"><b></b><span>Rank ${d.pts}/${d.max}</span></div>` +
        (d.isnew ? '<div class="tip-new">New in Forever</div>' : '') + '<div class="tip-desc"></div>' +
        `<div class="tip-status ${taken && d.sim ? 'sim' : ''}">${!taken ? 'Not taken' : d.sim ? 'Simulated' : 'No effect in this simulation'}</div>`;
      tip.querySelector('b').textContent = d.name;
      tip.querySelector('.tip-desc').textContent = d.desc;
      tip.style.display = 'block';
    }
    // Keep the tooltip beside the cursor and inside the window
    const w = tip.offsetWidth, h = tip.offsetHeight;
    let x = e.clientX + 16, y = e.clientY + 16;
    if (x + w > window.innerWidth - 8) x = e.clientX - w - 12;
    if (y + h > window.innerHeight - 8) y = e.clientY - h - 12;
    tip.style.left = Math.max(8, x) + 'px';
    tip.style.top = Math.max(8, y) + 'px';
  });
}

// --- Stats tab: custom character stats, independent of the gear list ---
const STAT_FIELDS = [
  ['str', 'Strength', 1, 0, 2000], ['agi', 'Agility', 1, 0, 2000], ['int', 'Intellect', 1, 0, 2000], ['spi', 'Spirit', 1, 0, 2000],
  ['ap', 'Attack power', 1, 0, 10000], ['sp', 'Spell damage', 1, 0, 5000],
  ['crit', 'Melee crit chance %', 0.01, 0, 100], ['spellCrit', 'Spell crit chance %', 0.01, 0, 100], ['hit', 'Hit chance %', 0.1, 0, 50],
  ['wMin', 'Weapon min damage', 1, 1, 2000], ['wMax', 'Weapon max damage', 1, 1, 2000], ['wSpeed', 'Weapon speed', 0.1, 1, 4],
];
function renderResultStats() {
  const stat = (label, value) => `<div class="stat"><b>${value}</b>${label}</div>`;
  $('stats-result').innerHTML =
    stat('Attack power (buffed)', CFG.ap) + stat('Spell damage (buffed)', CFG.sp) +
    stat('Melee crit chance (buffed)', CFG.crit.toFixed(2) + '%') + stat('Spell crit chance (buffed)', CFG.spellCrit.toFixed(2) + '%') +
    stat('Hit chance', '+' + CFG.hit + '%') + stat('Maximum mana', CFG.maxMana) +
    stat('Strength (buffed)', STATS.str) + stat('Agility (buffed)', STATS.agi) + stat('Intellect (buffed)', STATS.int);
}
function fillStatsTab() {
  $('custom-on').checked = custom().on;
  $('custom-fields').classList.toggle('off', !custom().on);
  $('tab-stats').querySelectorAll('input[data-k]').forEach(el => { el.value = custom()[el.dataset.k]; });
}
function setupChanged() {
  applySetup();
  if (!S.started) S.mana = CFG.maxMana;
  S.mana = Math.min(S.mana, CFG.maxMana);
  renderGearTab(); renderResultStats();
}
{
  $('tab-stats').innerHTML =
    `<label class="custom-toggle"><input type="checkbox" id="custom-on"> Use custom stats instead of the gear list</label>` +
    `<div class="fields" id="custom-fields">` +
    STAT_FIELDS.map(([k, label, step, min, max]) =>
      `<label>${label}<input type="number" data-k="${k}" step="${step}" min="${min}" max="${max}"></label>`).join('') +
    `</div>` +
    `<button class="plain-btn" id="custom-copy">Copy current gear into the fields</button>` +
    `<h2>Resulting stats in the sim</h2><div class="statgrid" id="stats-result"></div>` +
    `<footer>Enter your unbuffed character-sheet values, with talents and the Rockbiter Weapon imbue included. Raid buffs and consumables from the left panel are added on top; ` +
    `Strength, Agility, Intellect and Spirit are used to work out what those buffs add. The weapon enchant (Crusader) and talents stay as they are. ` +
    `Custom stats are kept separately for each spec, apply immediately, and are saved in this browser.</footer>`;
  const save = () => { store.set('shamanSimCustomStats_' + SPEC_ID, custom()); setupChanged(); };
  $('custom-on').addEventListener('change', e => { custom().on = e.target.checked; $('custom-fields').classList.toggle('off', !custom().on); save(); });
  $('custom-fields').addEventListener('input', e => {
    const f = STAT_FIELDS.find(f => f[0] === e.target.dataset.k);
    const v = Number(e.target.value);
    if (!f || e.target.value === '' || !Number.isFinite(v)) return;
    custom()[f[0]] = Math.min(f[4], Math.max(f[3], v));
    save();
  });
  $('custom-fields').addEventListener('change', fillStatsTab);
  $('custom-copy').addEventListener('click', () => { Object.assign(custom(), gearSheet()); fillStatsTab(); save(); });
}

// --- Setup panel: raid buffs, consumables, boss debuffs ---
{
  const panel = $('buffpanel');
  const draw = () => {
    panel.innerHTML = TOGGLE_GROUPS.map((g, i) =>
      `<section><h2>${g.title}</h2>` +
      `<div class="buffbtns"><button data-group="${i}" data-on="1">All</button><button data-group="${i}" data-on="">None</button></div>` +
      g.items.map(b =>
        `<label class="rbuff ${b.on ? 'on' : ''}" title="${b.desc}"><input type="checkbox" data-id="${b.id}" ${b.on ? 'checked' : ''}>` +
        `<img src="${iconUrl(b.icon)}" alt=""><span><b>${b.name}</b><small>${b.desc}</small></span></label>`).join('') +
      `</section>`).join('');
  };
  const changed = () => { draw(); setupChanged(); };
  panel.addEventListener('change', e => {
    ALL_TOGGLES.find(b => b.id === e.target.dataset.id).on = e.target.checked;
    changed();
  });
  panel.addEventListener('click', e => {
    if (!e.target.dataset.group) return;
    TOGGLE_GROUPS[e.target.dataset.group].items.forEach(b => b.on = !!e.target.dataset.on);
    changed();
  });
  draw();
}

// --- Spec switch ---
function setSpec(id) {
  SPEC_ID = id; SPEC = SPECS[id];
  store.set('shamanSimSpec', id);
  if (rebinding) setRebinding(false);
  applySetup();
  reset();
  document.querySelectorAll('#specbar button').forEach(b => b.classList.toggle('active', b.dataset.spec === id));
  $('spec-title').textContent = SPEC.title;
  document.title = `WoW Forever ${SPEC.title} Simulator`;
  buildBar(); renderGearTab(); renderTalentsTab(); fillStatsTab(); renderResultStats();
  $('footer').textContent = `${SPEC.blurb} Press Start fight, then use the keys shown on the buttons, or click, to use abilities. ` +
    `See the Gear, Talents and Stats tabs for the setup.`;
}
document.querySelectorAll('#specbar button').forEach(b => b.addEventListener('click', () => { if (b.dataset.spec !== SPEC_ID) setSpec(b.dataset.spec); }));

// --- Frame rendering ---
function render() {
  arenaEl.classList.toggle('idle', !S.started);
  const hpPct = S.hp / CFG.targetHp * 100;
  $('hpfill').style.width = hpPct + '%';
  $('hpbar').classList.toggle('execute', S.hp <= CFG.targetHp * CFG.executeRange);
  $('hptext').textContent = `${Math.ceil(S.hp).toLocaleString()} / ${CFG.targetHp.toLocaleString()} (${Math.ceil(hpPct)}%)`;
  $('ragefill').style.width = S.mana / CFG.maxMana * 100 + '%';
  $('ragetext').textContent = `${Math.floor(S.mana).toLocaleString()} / ${CFG.maxMana.toLocaleString()}`;
  $('mhbar').style.width = S.swing * 100 + '%';
  $('castbar').style.width = S.cast ? Math.min(1, 1 - (S.cast.until - S.t) / S.cast.total) * 100 + '%' : '0';
  $('casttext').textContent = S.cast ? `${S.cast.ability.name} ${fmtTime(Math.max(0, S.cast.until - S.t))}` : '';

  for (const a of barAbilities()) {
    const cd = cdOf(a);
    const cdLeft = (S.ready[a.id] || 0) - S.t;
    const gcdLeft = a.gcd ? S.gcdUntil - S.t : 0;
    let frac = 0;
    if (cdLeft > 0 && cdLeft >= gcdLeft && cd) frac = cdLeft / cd;
    else if (gcdLeft > 0) frac = gcdLeft / (a.gcdTime || CFG.gcd);
    a.mask.style.height = Math.min(1, frac) * 100 + '%';
    a.cdText.textContent = cdLeft > 0 && cd ? fmtTime(cdLeft) : '';
    a.el.classList.toggle('norage', !S.started || S.mana < a.cost() || !!(a.usable && !a.usable()));
    a.el.classList.toggle('proc', S.started && abilityLit(a));
  }

  const buffs = classBuffs();
  const html = buffs.map(([icon, text]) => `<div class="buff"><img src="${iconUrl(icon)}" alt="">${text}</div>`).join('');
  if ($('buffs').innerHTML !== html) $('buffs').innerHTML = html;

  $('meter').innerHTML = `DPS <b>${S.t > 0 ? (S.totalDamage / S.t).toFixed(1) : '0.0'}</b> · ` +
    `Damage <b>${S.totalDamage.toLocaleString()}</b> · Time <b>${fmtTime(S.t)}</b>`;
}

function frame(now) {
  // Cap the step so a backgrounded tab pauses rather than fast-forwarding
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  if (S.started && !S.over) tick(dt);
  render();
  requestAnimationFrame(frame);
}

setSpec(SPEC_ID);
requestAnimationFrame(frame);
</script>
</body>
</html>
